<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jeu de cartes</title>
  <style>
    :root { --bg: #14141c; --panel: #1f1f2b; --text: #f2f2f7; }
    body { font-family: sans-serif; margin: 0; padding: 1.5rem 1rem 4rem; background: var(--bg); color: var(--text); text-align: center; }
    h1 { margin-top: 0; }
    a { color: #8ea1ff; }
    button { font-size: 1.1rem; padding: .8rem 1.4rem; border: 0; border-radius: 8px; background: #5865f2; color: #fff; cursor: pointer; }
    button:disabled { background: #3a3a4a; color: #888; cursor: not-allowed; }
    button.secondary { background: #3a3a4a; font-size: .9rem; padding: .5rem 1rem; }
    button.small { font-size: .8rem; padding: .35rem .6rem; margin-top: .4rem; }
    .bar { display: flex; gap: .8rem; justify-content: center; align-items: center; flex-wrap: wrap; margin: 1rem 0; }
    .stat { background: var(--panel); padding: .5rem 1rem; border-radius: 8px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: .6rem; max-width: 900px; margin: 1rem auto; }
    .shop { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: .6rem; max-width: 600px; margin: 1rem auto; }
    .card { border: 3px solid var(--c, #666); background: var(--panel); border-radius: 10px; padding: .4rem .3rem; min-height: 110px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: .2rem; font-size: .85rem; }
    .card img.art { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 6px; display: block; }
    .card small { opacity: .75; }
    .card.missing { opacity: .35; border-style: dashed; aspect-ratio: 2 / 3; min-height: 0; }
    .card.new::after { content: "NOUVEAU"; color: #ffd24a; font-size: .7rem; font-weight: bold; margin-top: .3rem; }
    #msg { opacity: .8; min-height: 1.5rem; margin-top: 1rem; }
    h3 { margin-bottom: .3rem; }
    h4 { margin: 1.5rem 0 .2rem; }
  </style>
</head>
<body>
  <h1>Jeu de cartes</h1>
  <div id="app">Chargement…</div>
  <p id="msg"></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = "https://hzabzcjvbricrferrxje.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Stf0JCgiDfKW4fSTDwNOxg_lu3HERpK";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const COLORS = {
      commune: "#9aa0a6", peu_commune: "#4caf50", rare: "#3b82f6",
      super_rare: "#a855f7", ultra_rare: "#f59e0b", legendaire: "#ef4444"
    };
    const app = document.getElementById("app");
    const $ = (id) => document.getElementById(id);
    let rarityLabels = {}, rarityValues = {};
    let stock = 0, maxStock = 5, coins = 0, secondsLeft = null;
    let dupCount = 0, dupGain = 0;
    let tickId = null, refreshing = false, busy = false, currentUser;

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }
    function setMsg(t) { $("msg").textContent = t || ""; }
    function pad(n) { return String(n).padStart(2, "0"); }
    function fmt(s) { return Math.floor(s / 60) + ":" + pad(s % 60); }

    function cardEl(c, extra, qty, withDiscard) {
      const d = el("div", "card " + (extra || ""));
      d.style.setProperty("--c", COLORS[c.rarity_id] || "#666");
      if (c.image_path) {
        const img = el("img", "art");
        img.loading = "lazy";
        img.alt = c.name;
        img.src = db.storage.from("cards").getPublicUrl(c.image_path).data.publicUrl;
        img.onerror = () => img.remove();
        d.appendChild(img);
      }
      d.appendChild(el("strong", "", "#" + pad(c.number)));
      d.appendChild(el("span", "", c.name));
      d.appendChild(el("small", "", rarityLabels[c.rarity_id] || c.rarity_id));
      if (qty > 1) d.appendChild(el("small", "", "×" + qty));
      if (withDiscard && qty > 1) {
        const b = el("button", "secondary small", "Défausser ×" + (qty - 1));
        b.onclick = () => discard(c.id);
        d.appendChild(b);
      }
      return d;
    }

    function paint() {
      $("statStock").textContent = "Packs : " + stock + " / " + maxStock;
      $("statCoins").textContent = "Pièces : " + coins;
      $("statTimer").textContent = secondsLeft == null ? "Stock plein" : "Prochain pack dans " + fmt(secondsLeft);
      $("openBtn").disabled = busy || stock < 1;
      document.querySelectorAll("[data-price]").forEach((b) => {
        b.disabled = busy || coins < Number(b.dataset.price);
      });
      const da = $("discardAll");
      if (da) {
        da.disabled = busy || dupCount === 0;
        da.textContent = dupCount === 0
          ? "Aucun doublon à défausser"
          : "Défausser tous les doublons (+" + dupGain + " pièces)";
      }
    }

    async function loadStatus() {
      const { data, error } = await db.rpc("get_status");
      if (error) { setMsg(error.message); return; }
      stock = data.stock; maxStock = data.max_stock; coins = data.coins; secondsLeft = data.seconds_to_next;
      paint();
    }

    function startTick() {
      if (tickId) clearInterval(tickId);
      tickId = setInterval(async () => {
        if (secondsLeft == null) return;
        secondsLeft -= 1;
        if (secondsLeft <= 0) {
          if (!refreshing) { refreshing = true; await loadStatus(); refreshing = false; }
        } else { paint(); }
      }, 1000);
    }

    async function openPack(packId) {
      if (busy) return;
      busy = true; paint(); setMsg("");
      const { data, error } = await db.rpc("open_pack", { p_pack_type: packId });
      if (error) { setMsg(error.message); busy = false; await loadStatus(); return; }
      const area = $("packArea");
      area.textContent = "";
      data.cards.forEach((c) => area.appendChild(cardEl(c, c.is_new ? "new" : "", 0, false)));
      stock = data.stock; secondsLeft = data.seconds_to_next; coins = data.coins;
      busy = false;
      paint();
      await loadCollection();
    }

    async function discard(cardId) {
      if (busy) return;
      busy = true; paint(); setMsg("");
      const { data, error } = await db.rpc("discard_duplicates", cardId ? { p_card_id: cardId } : {});
      busy = false;
      if (error) { setMsg(error.message); paint(); return; }
      coins = data.coins;
      paint();
      setMsg("+" + data.gained + " pièces (" + data.discarded + " doublon(s) défaussé(s))");
      await loadCollection();
    }

    async function loadRarities() {
      const { data } = await db.from("rarities").select("id, label, discard_value");
      (data || []).forEach((r) => { rarityLabels[r.id] = r.label; rarityValues[r.id] = r.discard_value; });
    }

    async function loadShop() {
      const { data, error } = await db.from("pack_types").select("id, name, price, cards_per_pack").order("price");
      if (error) { setMsg(error.message); return; }
      const shop = $("shop");
      shop.textContent = "";
      data.filter((p) => p.price !== null).forEach((p) => {
        const d = el("div", "card");
        d.appendChild(el("strong", "", p.name));
        d.appendChild(el("small", "", p.cards_per_pack + " cartes"));
        const b = el("button", "small", "Acheter (" + p.price + " pièces)");
        b.dataset.price = p.price;
        b.onclick = () => openPack(p.id);
        d.appendChild(b);
        shop.appendChild(d);
      });
      paint();
    }

    async function loadCollection() {
      const [cardsRes, collRes, seriesRes] = await Promise.all([
        db.from("cards").select("id, number, name, rarity_id, series_id, image_path").order("number"),
        db.from("collection").select("card_id, quantity"),
        db.from("series").select("id, name, is_active").order("name")
      ]);
      const err = cardsRes.error || collRes.error || seriesRes.error;
      if (err) { setMsg(err.message); return; }

      const qty = {};
      collRes.data.forEach((r) => { qty[r.card_id] = r.quantity; });
      const bySeries = {};
      cardsRes.data.forEach((c) => { (bySeries[c.series_id] = bySeries[c.series_id] || []).push(c); });

      const box = $("collection");
      box.textContent = "";
      dupCount = 0; dupGain = 0;

      seriesRes.data.forEach((s) => {
        const list = bySeries[s.id] || [];
        const ownedCount = list.filter((c) => qty[c.id]).length;
        if (!s.is_active && ownedCount === 0) return;

        box.appendChild(el("h4", "", s.name + " : " + ownedCount + " / " + list.length));
        const grid = el("div", "cards");
        list.forEach((c) => {
          const q = qty[c.id] || 0;
          if (q) {
            dupCount += q - 1;
            dupGain += (q - 1) * (rarityValues[c.rarity_id] || 0);
            grid.appendChild(cardEl(c, "", q, true));
          } else {
            const d = el("div", "card missing");
            d.appendChild(el("strong", "", "#" + pad(c.number)));
            d.appendChild(el("span", "", "???"));
            grid.appendChild(d);
          }
        });
        box.appendChild(grid);
      });
      paint();
    }

    function logoutButton() {
      const b = el("button", "secondary", "Se déconnecter");
      b.onclick = () => db.auth.signOut();
      return b;
    }

    function buildGame(profile) {
      app.textContent = "";
      app.appendChild(el("h2", "", "Bienvenue, " + profile.display_name + " !"));
      if (profile.is_admin) {
        const p = el("p");
        const a = el("a", "", "Administration");
        a.href = "/admin.html";
        p.appendChild(a);
        app.appendChild(p);
      }

      const bar = el("div", "bar");
      ["statStock", "statTimer", "statCoins"].forEach((id) => {
        const s = el("div", "stat");
        s.id = id;
        bar.appendChild(s);
      });
      app.appendChild(bar);

      const open = el("button", "", "Ouvrir un pack gratuit");
      open.id = "openBtn";
      open.onclick = () => openPack("gratuit");
      app.appendChild(open);

      app.appendChild(el("h3", "", "Boutique"));
      const shop = el("div", "shop");
      shop.id = "shop";
      app.appendChild(shop);

      const pack = el("div", "cards");
      pack.id = "packArea";
      app.appendChild(pack);

      app.appendChild(el("h3", "", "Ma collection"));
      const da = el("button", "secondary", "");
      da.id = "discardAll";
      da.onclick = () => discard(null);
      app.appendChild(da);
      const box = el("div", "");
      box.id = "collection";
      app.appendChild(box);

      app.appendChild(logoutButton());
    }

    async function render(session) {
      const uid = session ? session.user.id : null;
      if (uid === currentUser) return;
      currentUser = uid;
      setMsg("");

      if (!session) {
        if (tickId) clearInterval(tickId);
        app.textContent = "";
        const btn = el("button", "", "Se connecter avec Discord");
        btn.onclick = () => db.auth.signInWithOAuth({
          provider: "discord",
          options: { redirectTo: window.location.origin }
        });
        app.appendChild(btn);
        return;
      }

      const { data: profile, error } = await db.from("profiles").select("display_name, is_admin").maybeSingle();
      if (!profile) {
        app.textContent = "";
        app.appendChild(el("p", "", "Profil introuvable. " + (error ? error.message : "")));
        app.appendChild(logoutButton());
        return;
      }
      buildGame(profile);
      startTick();
      await loadRarities();
      await loadStatus();
      await loadShop();
      await loadCollection();
    }

    db.auth.getSession().then(({ data }) => render(data.session));
    db.auth.onAuthStateChange((_event, session) => { setTimeout(() => render(session), 0); });
  </script>
</body>
</html>
